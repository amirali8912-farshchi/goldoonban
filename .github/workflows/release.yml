name: Goldoonban Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.8"

jobs:

  # ============================================================
  # ANDROID
  # ============================================================

  android:
    name: Android
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --build-number ${{ github.run_number }}

      - name: Build AAB
        run: |
          flutter build appbundle \
            --release \
            --build-number ${{ github.run_number }}

      - name: Prepare Android Files
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release/android"

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "$GITHUB_WORKSPACE/release/android/Goldoonban-arm64-v8a.apk"

          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "$GITHUB_WORKSPACE/release/android/Goldoonban-armeabi-v7a.apk"

          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "$GITHUB_WORKSPACE/release/android/Goldoonban-x86_64.apk"

          cp build/app/outputs/bundle/release/app-release.aab \
            "$GITHUB_WORKSPACE/release/android/Goldoonban.aab"

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/android/


  # ============================================================
  # WEB
  # ============================================================

  web:
    name: Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      # Build مخصوص GitHub Pages
      - name: Build Web
        run: |
          flutter build web \
            --release \
            --base-href /goldoonban/

      # ZIP برای GitHub Release
      - name: Create Web ZIP
        shell: bash
        run: |
          cd build
          zip -r "$GITHUB_WORKSPACE/Goldoonban-Web.zip" web

      - name: Upload Web Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: Goldoonban-Web.zip

      # Artifact مخصوص GitHub Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile_app/build/web


  # ============================================================
  # WINDOWS
  # ============================================================

  windows:
    name: Windows
    runs-on: windows-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath "$env:GITHUB_WORKSPACE\Goldoonban-Windows.zip"

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Goldoonban-Windows.zip


  # ============================================================
  # LINUX
  # ============================================================

  linux:
    name: Linux
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Linux
        run: flutter config --enable-linux-desktop

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create Linux Archive
        shell: bash
        run: |
          tar -czf "$GITHUB_WORKSPACE/Goldoonban-Linux.tar.gz" \
            -C build/linux/x64/release bundle

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Goldoonban-Linux.tar.gz


  # ============================================================
  # MACOS
  # ============================================================

  macos:
    name: macOS
    runs-on: macos-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS
        run: flutter config --enable-macos-desktop

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Create macOS ZIP
        shell: bash
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/Goldoonban-macOS.zip" *.app

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Goldoonban-macOS.zip


  # ============================================================
  # GITHUB PAGES DEPLOY
  # ============================================================

  pages:
    name: Deploy Web to GitHub Pages
    runs-on: ubuntu-latest

    needs:
      - web

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: GitHub Release
    runs-on: ubuntu-latest

    needs:
      - android
      - web
      - windows
      - linux
      - macos

    permissions:
      contents: write

    steps:

      # Release Job هم Repository را نیاز دارد
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Download Artifacts
      # -------------------------

      - name: Download Android
        uses: actions/download-artifact@v4
        with:
          name: android
          path: release/android

      - name: Download Web
        uses: actions/download-artifact@v4
        with:
          name: web
          path: release/web

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release/windows

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: release/linux

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: release/macos

      # -------------------------
      # Show files
      # -------------------------

      - name: Show Release Files
        shell: bash
        run: |
          echo "================================="
          echo "Goldoonban Release Files"
          echo "================================="
          find release -type f -print
          echo "================================="

      # -------------------------
      # Get Version
      # -------------------------

      - name: Get Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' mobile_app/pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)

          if [ -z "$VERSION" ]; then
            echo "Could not find version in pubspec.yaml"
            exit 1
          fi

          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # -------------------------
      # Create GitHub Release
      # -------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}

        shell: bash
        run: |
          gh release create \
            "v${VERSION}-build-${{ github.run_number }}" \
            release/android/*.apk \
            release/android/*.aab \
            release/web/*.zip \
            release/windows/*.zip \
            release/linux/*.tar.gz \
            release/macos/*.zip \
            --title "Goldoonban ${VERSION} Build #${{ github.run_number }}" \
            --generate-notes