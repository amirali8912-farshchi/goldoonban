name: Goldoonban Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.8"

jobs:

  # ============================================================
  # ANDROID
  # ============================================================
  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APKs
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --build-number ${{ github.run_number }}

      - name: Build AAB
        run: |
          flutter build appbundle \
            --release \
            --build-number ${{ github.run_number }}

      - name: Rename Android files
        shell: bash
        run: |
          mkdir -p release

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            release/Goldoonban-arm64-v8a.apk

          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            release/Goldoonban-armeabi-v7a.apk

          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            release/Goldoonban-x86_64.apk

          cp build/app/outputs/bundle/release/app-release.aab \
            release/Goldoonban.aab

      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile_app/release/


  # ============================================================
  # WEB
  # ============================================================
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Create Web ZIP
        run: |
          cd build
          zip -r ../../Goldoonban-Web.zip web

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: Goldoonban-Web.zip


  # ============================================================
  # WINDOWS
  # ============================================================
  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows
        run: flutter config --enable-windows-desktop

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath Goldoonban-Windows.zip

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: mobile_app/Goldoonban-Windows.zip


  # ============================================================
  # LINUX
  # ============================================================
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Linux
        run: flutter config --enable-linux-desktop

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create Linux Archive
        run: |
          tar -czf ../Goldoonban-Linux.tar.gz \
            -C build/linux/x64/release bundle

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: mobile_app/Goldoonban-Linux.tar.gz


  # ============================================================
  # MACOS
  # ============================================================
  macos:
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS
        run: flutter config --enable-macos-desktop

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Create macOS ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../../Goldoonban-macOS.zip *.app

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: mobile_app/Goldoonban-macOS.zip


  # ============================================================
  # CREATE RELEASE
  # ============================================================
  release:
    name: GitHub Release
    runs-on: ubuntu-latest

    needs:
      - android
      - web
      - windows
      - linux
      - macos

    steps:

      - name: Download Android
        uses: actions/download-artifact@v4
        with:
          name: android
          path: release

      - name: Download Web
        uses: actions/download-artifact@v4
        with:
          name: web
          path: release

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: release

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: release

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' mobile_app/pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)

          gh release create \
            "v${VERSION}-build-${{ github.run_number }}" \
            release/* \
            --title "Goldoonban ${VERSION} Build #${{ github.run_number }}" \
            --generate-notes